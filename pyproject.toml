[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sn_phystools"
version = "1.1.0"
requires-python = ">=3.5"
dependencies = ['sn_tools>=0.1']
authors = [
  {name = "Philippe Gris", email = "philippe.gris@clermont.in2p3.fr"}
]
maintainers = [
  {name = "Philippe Gris", email = "philippe.gris@clermont.in2p3.fr"}
]
description = "Set of tools for supernovae studies"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = ["Programming Language :: Python",]

[tool.setuptools.packages.find]
where = [".","sn_phystools_input"]
include = ['sn_desc_ddf_strategy', 'sn_analysis',
	'sn_cosmology', 'sn_phystools_input']

[tool.setuptools.package-data]
"*" = ["*.txt"]

[project.urls]
Homepage = "http://github.com/lsstdesc/sn_phystools"
Repository = "https://github.com/lsstdesc/sn_phystools"